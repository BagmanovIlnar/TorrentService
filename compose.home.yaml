# Фрагмент для вставки в home_server/docker-compose.yml.
# Отличия от dev-версии:
#   - build из папки сервиса
#   - AUTH_MODE=ad против service_samba_addc
#   - сеть network_service (DC резолвится по имени контейнера)
#   - depends_on DC healthy — как у service_samba_folder
  # ============================================================
  # Torrent Service — веб-клиент торрентов (librqbit)
  # Порты 8280/6882: 8080/6881 заняты qbittorrent.
  # Категории -> подпапки в /downloads (общий каталог с *arr-стеком).
  # ============================================================
  service_torrent_service:
    restart: always
    container_name: service_torrent_service
    build:
      context: ./services/torrent_service
      args:
        # Kerberos SSO: cargo feature sso (libgssapi)
        CARGO_FEATURES: "sso"
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - PORT=${TORRENT_HTTP_PORT:-8280}
      - BT_PORT=${TORRENT_BT_PORT:-6882}
      - DOWNLOADS_DIR=/downloads
      - PERSIST_DIR=/state
      - AUTH_MODE=ad
      - AD_URL=ldap://service_samba_addc:389
      - AD_DOMAIN=${AD_REALM:-HOME.ARPA}
      - SECRET=${SECRET:?Set SECRET in .env (openssl rand -hex 32)}
      # --- Kerberos SSO ---
      # Доменные машины с тикетом входят без пароля (SPNEGO).
      # На DC один раз:
      #   samba-tool spn add HTTP/torrentsvc torrentsvc   (или существующая учётка)
      #   samba-tool domain exportkeytab /path/to/torrent.keytab --principal=HTTP/torrentsvc
      # и положить keytab в ./folders/torrent_service/keytab/torrent.keytab
      # (kdc-хост берётся из AD_URL, krb5.conf генерится в /state при старте)
      - SSO_ENABLED=${SSO_ENABLED:-true}
      - SSO_SPN=${SSO_SPN:-}
      - KRB5_KTNAME=FILE:/keytab/torrent.keytab
      - SEED_RATIO_LIMIT=${SEED_RATIO_LIMIT:-0}
      - SEED_TIME_MINUTES=${SEED_TIME_MINUTES:-0}
    depends_on:
      service_samba_addc:
        condition: service_healthy
    networks:
      network_service:
    ports:
      - "${TORRENT_HTTP_PORT:-8280}:8280"
      - "${TORRENT_BT_PORT:-6882}:6882"
      - "${TORRENT_BT_PORT:-6882}:6882/udp"
    volumes:
      - ./folders/torrent_service/downloads:/downloads
      - ./folders/torrent_service/state:/state
      - ./folders/torrent_service/keytab:/keytab:ro
